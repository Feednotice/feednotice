# Checks on every push and pull request: nothing broken should reach the server.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Docker stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint the shell scripts
        run: shellcheck -x -P SCRIPTDIR docker/mta/*.sh docker/backup/*.sh

      - name: Test configuration
        run: |
          cp .env.example .env
          sed -i "s|^SITE_DOMAIN=.*|SITE_DOMAIN=localhost|; s|^BASE_URL=.*|BASE_URL=https://localhost|; s|^SERVICE_NAME=.*|SERVICE_NAME=CI Feeds|" .env
          sed -i "s|^SECRET=.*|SECRET=$(openssl rand -hex 32)|; s|^WEBHOOK_SECRET=.*|WEBHOOK_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^DKIM_KEY_FILE=.*|DKIM_KEY_FILE=|" .env
          # Off-site backups to a repository inside the container: enough to test the whole chain.
          printf 'COMPOSE_PROFILES=backup\nRESTIC_REPOSITORY=/tmp/ci-repo\nRESTIC_PASSWORD=%s\n' "$(openssl rand -hex 16)" >> .env
          docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' feednotice-app-1)" = healthy ] && break
            sleep 2
          done
          docker compose ps

      - name: Smoke test
        run: |
          curl -fsSk https://localhost/health
          curl -fsSk https://localhost/ | grep -q "in your inbox"
          curl -fsSk -H 'Accept-Language: fr' https://localhost/ | grep -q "dans votre boîte aux lettres"
          BOUNCE_ADDRESS="$(sed -n 's/^BOUNCE_ADDRESS=//p' .env)" python3 - <<'PY'
          import os, smtplib
          s = smtplib.SMTP('127.0.0.1', 25, timeout=10)
          s.ehlo('ci.example')
          s.mail('someone@example.com')
          relay = s.rcpt('victim@example.com')[0]
          bounce = s.rcpt(os.environ['BOUNCE_ADDRESS'])[0]
          s.quit()
          print('relay to outside:', relay, '/ bounce address:', bounce)
          assert relay >= 500, 'the MTA must refuse to relay'
          assert bounce == 250, 'the MTA must accept the bounce address'
          PY

      - name: Mail log kept in a file, rotated
        run: |
          docker compose exec -T mta maillog | grep -q 'daemon started'
          docker compose exec -T mta rotate-maillog 14
          docker compose exec -T mta sh -c 'ls /var/log/postfix | grep -q "^mail\.log\."'

      - name: Backup and restore test
        run: |
          docker compose exec -T app node src/cli.ts backup
          docker compose exec -T backup backup-now
          docker compose exec -T backup restore-test
          docker compose exec -T app cat /app/backup-status/restore.json | grep -q '"ok":true'

      - name: Logs
        if: always()
        run: docker compose logs --no-color | tail -100
