# Releases. Two ways in:
# - Actions → Release → "Run workflow", with a version (and optionally the commit to release):
#   the workflow creates the tag itself. With "replace", it first deletes the tag and the release
#   of that version: only for a release that failed, before anyone used it.
# - a version tag (v1.2.3) pushed, or created with a release on GitHub.
# Then: the tests, the three images on GitHub's registry, the release's notes from the changelog.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, as in package.json (e.g. 0.4.0)'
        required: true
      ref:
        description: 'Branch or commit to release (a branch name, or a commit id, short or full)'
        required: true
        default: main
      replace:
        description: 'Replace an existing tag and release of this version (a failed release only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      latest: ${{ steps.resolve.outputs.latest }}
    steps:
      # The whole history: the commit to release is looked up with git, which, unlike the
      # checkout action, understands short commit ids.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: resolve
        name: Version, commit and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPLACE: ${{ inputs.replace }}
          REF: ${{ inputs.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            sha=$(git rev-parse --verify --quiet "origin/$REF^{commit}" || git rev-parse --verify --quiet "$REF^{commit}") \
              || { echo "::error::No branch or commit '$REF'"; exit 1; }
            git checkout --quiet "$sha"
          else
            sha=$(git rev-parse HEAD)
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Version must look like 1.2.3"; exit 1; }
            tag="v$VERSION"
          else
            tag="$GITHUB_REF_NAME"
          fi
          package=$(node -p 'require("./package.json").version')
          [ "v$package" = "$tag" ] || { echo "::error::package.json at $sha says $package, not ${tag#v}: bump it in a pull request first (CONTRIBUTING.md, Releasing)"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            existing=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
            if [ -n "$existing" ] && [ "$(git rev-parse "$existing^{commit}")" != "$sha" ]; then
              [ "$REPLACE" = true ] || { echo "::error::$tag already exists on another commit. Tick 'replace' only if that release failed."; exit 1; }
              gh release delete "$tag" --yes || true
              git push origin ":refs/tags/$tag"
              existing=
            fi
            if [ -z "$existing" ]; then
              git tag "$tag" "$sha"
              git push origin "refs/tags/$tag"
            fi
          fi
          # Only the highest version gets "latest": re-releasing an old one must not take it back.
          git fetch --quiet --tags --force origin
          highest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          latest=$([ "$tag" = "$highest" ] && echo true || echo false)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $sha (latest: $latest)" >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  images:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: feednotice
            context: .
          - name: feednotice-mta
            context: docker/mta
          - name: feednotice-backup
            context: docker/backup
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [prepare, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      LATEST: ${{ needs.prepare.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::No '## $version' section in CHANGELOG.md"; exit 1; }
      - name: Create the release, or fill in the one made with the tag on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md --latest="$LATEST"
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag --latest="$LATEST"
          fi
