# FeedNotice: one VPS, three containers.
#   app    web pages, feed reading, sending (Node.js + SQLite)
#   mta    send-only Postfix; receives only the bounce address and hands it to the app
#   caddy  HTTPS reverse proxy
# Settings come from .env (see .env.example). Two variables, for a deployment that includes
# this file from another folder (docs/deploy.md): ENV_FILE, the settings file, and BRAND_PATH,
# your logo, favicons and colours (docs/branding.md). Both paths are relative to this folder.

name: feednotice

# Container logs are rotated by size; they hold no address. Postfix's mail log, which does, is a
# file in the mta-logs volume kept MTA_LOG_DAYS days (14). See docs/privacy.md.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    # Released images (docs/deploy.md): `docker compose pull`. Without a release, `build` is used.
    image: ghcr.io/feednotice/feednotice:${FEEDNOTICE_VERSION:-latest}
    build: .
    logging: *logging
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      BRAND_DIR: /app/brand
      BACKUP_STATUS_DIR: /app/backup-status
      DB_PATH: /app/data/feednotice.sqlite
      MAIL_TRANSPORT: smtp
      SMTP_HOST: mta
      SMTP_PORT: "2525"
      TRUST_PROXY: "1"
    volumes:
      - app-data:/app/data
      - ${BRAND_PATH:-./docker/no-brand}:/app/brand:ro
      - backup-status:/app/backup-status:ro
    networks: [internal]
    depends_on: [mta]

  mta:
    image: ghcr.io/feednotice/feednotice-mta:${FEEDNOTICE_VERSION:-latest}
    build: docker/mta
    logging: *logging
    restart: unless-stopped
    hostname: ${MTA_HOSTNAME}
    # Only what Postfix needs: SECRET, which signs every link, stays with the app.
    environment:
      MTA_HOSTNAME: ${MTA_HOSTNAME}
      BOUNCE_ADDRESS: ${BOUNCE_ADDRESS}
      POSTMASTER_FORWARD: ${POSTMASTER_FORWARD}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      MTA_INET_PROTOCOLS: ${MTA_INET_PROTOCOLS:-ipv4}
      MTA_LOG_DAYS: ${MTA_LOG_DAYS:-14}
      APP_URL: http://app:8080
      MTA_TRUSTED_NETWORKS: 172.30.0.0/24
    ports:
      - "25:25"
    volumes:
      - mta-spool:/var/spool/postfix
      - mta-logs:/var/log/postfix
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    depends_on: [app]

  # Off-site backups (optional): enabled with COMPOSE_PROFILES=backup in .env. Sends the app's
  # nightly copy to a restic repository, encrypted; tests a restore every Sunday.
  backup:
    image: ghcr.io/feednotice/feednotice-backup:${FEEDNOTICE_VERSION:-latest}
    build: docker/backup
    profiles: [backup]
    logging: *logging
    restart: unless-stopped
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      TZ: ${TIME_ZONE:-Europe/Paris}
    volumes:
      - app-data:/data:ro
      - backup-status:/status
      - backup-cache:/root/.cache/restic
    networks: [internal]

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  app-data:
  mta-spool:
  mta-logs:
  backup-status:
  backup-cache:
  caddy-data:
  caddy-config:
